# Демо-вопросы с эталоном по Flask 3.1.3 (data/repo/flask). Эталон проверен ВРУЧНУЮ по коду
# (чтение файла / grep / git log / git blame). Владелец: участник 5.
#
# Поля:
#   id                уникальный идентификатор
#   question          вопрос пользователя
#   type              semantic | graph | history | overview | trap
#   expected_files    файлы, где лежит ответ (пути относительно data/repo/flask)
#   expected_symbols  qualified_name символов, которые должны найтись (может быть пустым)
#   expected_ranges   "путь:начало-конец" (как ссылка в ответе агента), строки включительно
#   expected_commits  (только history) короткие хэши коммитов из data/repo/flask
#   reference_answer  эталонный ответ, 2-3 предложения
#   notes             чем проверено и на что смотреть при оценке
#
# Старый формат (category, gold_files, gold_answer) тоже читается: см. eval/run_eval.py::load_questions.

# --- semantic -------------------------------------------------------------------------------
- id: q01
  type: semantic
  question: "Как Flask обрабатывает исключение, которое возникло во view-функции во время запроса?"
  expected_files:
    - src/flask/app.py
    - src/flask/sansio/app.py
  expected_symbols:
    - Flask.full_dispatch_request
    - Flask.handle_user_exception
    - Flask.handle_http_exception
    - Flask.handle_exception
    - App._find_error_handler
  expected_ranges:
    - src/flask/app.py:904-920
    - src/flask/app.py:779-809
    - src/flask/app.py:744-777
    - src/flask/app.py:811-862
    - src/flask/sansio/app.py:823-846
  reference_answer: >-
    full_dispatch_request ловит любое Exception из before_request/view и передаёт его в
    handle_user_exception, которая отдаёт HTTPException в handle_http_exception, а для прочих
    ищет обработчик через _find_error_handler (сначала blueprint, потом app, по коду и по MRO);
    если обработчика нет, исключение пробрасывается выше. Необработанное исключение ловит
    wsgi_app и вызывает handle_exception: она шлёт сигнал got_request_exception, при
    PROPAGATE_EXCEPTIONS (или debug/testing) пробрасывает ошибку, иначе логирует её и
    возвращает InternalServerError (500) через обработчик 500, если он зарегистрирован.
  notes: "Проверено чтением app.py:744-920 и sansio/app.py:823-846. Вызов handle_exception: app.py:1514."

- id: q02
  type: semantic
  question: "Как работает маршрутизация во Flask: как URL сопоставляется с view-функцией?"
  expected_files:
    - src/flask/sansio/scaffold.py
    - src/flask/sansio/app.py
    - src/flask/app.py
    - src/flask/ctx.py
  expected_symbols:
    - Scaffold.route
    - App.add_url_rule
    - Flask.create_url_adapter
    - RequestContext.match_request
    - Flask.dispatch_request
  expected_ranges:
    - src/flask/sansio/scaffold.py:336-365
    - src/flask/sansio/app.py:605-661
    - src/flask/app.py:425-476
    - src/flask/ctx.py:357-365
    - src/flask/app.py:879-902
  reference_answer: >-
    Декоратор @route вызывает add_url_rule, которая создаёт werkzeug Rule с методами, добавляет
    его в app.url_map и кладёт функцию в view_functions[endpoint]. При запросе RequestContext
    получает MapAdapter через create_url_adapter (bind_to_environ), а match_request записывает
    в request найденные url_rule и view_args (или routing_exception). dispatch_request берёт
    view_functions[rule.endpoint] и вызывает её с view_args; для OPTIONS может ответить
    автоматически.
  notes: "Проверено чтением файлов. match_request вызывается из RequestContext.push (ctx.py:404)."

- id: q03
  type: semantic
  question: "Где и когда создаётся (открывается) сессия пользователя и где она сохраняется?"
  expected_files:
    - src/flask/ctx.py
    - src/flask/sessions.py
    - src/flask/app.py
  expected_symbols:
    - RequestContext.push
    - SecureCookieSessionInterface.open_session
    - SecureCookieSessionInterface.save_session
    - SessionInterface.make_null_session
    - Flask.process_response
  expected_ranges:
    - src/flask/ctx.py:377-404
    - src/flask/sessions.py:323-335
    - src/flask/sessions.py:337-385
    - src/flask/app.py:1298-1324
  reference_answer: >-
    Сессия открывается в RequestContext.push: если _session ещё нет, вызывается
    app.session_interface.open_session, а при None подставляется make_null_session. По
    умолчанию SecureCookieSessionInterface.open_session читает подписанную cookie через
    itsdangerous и возвращает SecureCookieSession (пустую, если cookie нет или подпись
    неверна). Сохраняется сессия в Flask.process_response вызовом save_session, который
    ставит или удаляет cookie и добавляет Vary: Cookie.
  notes: "Проверено чтением ctx.py:377-404, sessions.py:323-385, app.py:1298-1324."

- id: q04
  type: semantic
  question: "Как выполняются функции before_request и after_request и в каком порядке?"
  expected_files:
    - src/flask/app.py
    - src/flask/sansio/scaffold.py
  expected_symbols:
    - Flask.preprocess_request
    - Flask.process_response
    - Scaffold.before_request
    - Scaffold.after_request
  expected_ranges:
    - src/flask/app.py:1271-1296
    - src/flask/app.py:1298-1324
    - src/flask/sansio/scaffold.py:460-484
    - src/flask/sansio/scaffold.py:487-505
  reference_answer: >-
    Декораторы before_request/after_request только добавляют функцию в before_request_funcs /
    after_request_funcs. preprocess_request сначала вызывает url_value_preprocessors, затем
    before_request-функции приложения и blueprint'ов; если одна из них вернула не None, это
    значение становится ответом и view не вызывается. process_response сначала вызывает
    функции after_this_request, затем after_request blueprint'ов и приложения в обратном
    порядке регистрации, после чего сохраняет сессию.
  notes: "Проверено чтением. Оба метода вызываются из full_dispatch_request / finalize_request."

