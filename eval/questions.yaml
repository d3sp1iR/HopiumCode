- id: q12
  type: trap
  question: "Как во Flask настроено встроенное ограничение частоты запросов (rate limiting)?"
  expected_files: []
  expected_symbols: []
  expected_ranges: []
  reference_answer: >-
    В исходном коде Flask (src/flask) встроенного rate limiting нет: нет ни конфигурации, ни
    middleware для ограничения частоты запросов. Агент должен сказать, что не нашёл это в
    коде, и не придумывать ссылки (обычно это делают сторонние расширения).
