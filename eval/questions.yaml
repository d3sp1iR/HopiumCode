# --- semantic -------------------------------------------------------------------------------
- id: q14
  type: semantic
  question: "Как Flask строит URL по имени endpoint и что происходит, если URL построить не удалось?"
  expected_files:
    - src/flask/helpers.py
    - src/flask/app.py
    - src/flask/sansio/app.py
  expected_symbols:
    - url_for
    - Flask.url_for
    - App.handle_url_build_error
    - App.inject_url_defaults
  expected_ranges:
    - src/flask/helpers.py:195-246
    - src/flask/app.py:1003-1127
    - src/flask/sansio/app.py:932-964
  reference_answer: >-
    Функция url_for из helpers просто вызывает current_app.url_for. Метод приложения берёт
    url_adapter из контекста запроса (относительные endpoint вида ".name" дополняет именем
    blueprint) или из контекста приложения, подставляет значения по умолчанию через
    inject_url_defaults и вызывает url_adapter.build. При BuildError вызывается
    handle_url_build_error: он по очереди пробует url_build_error_handlers и, если ни один не
    вернул значение, заново выбрасывает ошибку.
  notes: "Проверено чтением helpers.py:195-246, app.py:1003-1127, sansio/app.py:932-964."

- id: q15
  type: semantic
  question: "Как значение, которое вернула view-функция (строка, словарь, кортеж), превращается в объект ответа?"
  expected_files:
    - src/flask/app.py
  expected_symbols:
    - Flask.make_response
    - Flask.finalize_request
  expected_ranges:
    - src/flask/app.py:1129-1269
    - src/flask/app.py:922-951
  reference_answer: >-
    Это делает метод приложения make_response, его вызывает finalize_request. Кортеж
    распаковывается в (тело, статус, заголовки) или в пару (тело, статус|заголовки); None
    вызывает TypeError. Строки, bytes и итераторы оборачиваются в response_class, dict и list
    превращаются в JSON-ответ через self.json.response, а другие Response и WSGI-вызываемые
    объекты приводятся через force_type. Затем применяются статус и заголовки из кортежа.
  notes: "Проверено чтением app.py:1129-1269; вызов из finalize_request: app.py:939."

- id: q16
  type: semantic
  question: "Как работают одноразовые сообщения пользователю (flash): где они хранятся между запросами и как извлекаются?"
  expected_files:
    - src/flask/helpers.py
  expected_symbols:
    - flash
    - get_flashed_messages
  expected_ranges:
    - src/flask/helpers.py:318-349
    - src/flask/helpers.py:352-391
  reference_answer: >-
    flash добавляет пару (категория, сообщение) в список session["_flashes"], заново
    присваивает его в сессию и шлёт сигнал message_flashed. get_flashed_messages при первом
    вызове в запросе забирает список из сессии через pop и кэширует его в
    request_ctx.flashes, поэтому повторные вызовы в том же запросе возвращают те же сообщения;
    можно отфильтровать по категориям и вернуть категории вместе с текстом.
  notes: "Проверено чтением helpers.py:318-391. Слово flash в вопросе — термин, а не имя файла."

- id: q17
  type: semantic
  question: "Какими способами можно загрузить конфигурацию приложения (Python-файл, объект, переменные окружения)?"
  expected_files:
    - src/flask/config.py
  expected_symbols:
    - Config.from_envvar
    - Config.from_prefixed_env
    - Config.from_pyfile
    - Config.from_object
    - Config.from_file
  expected_ranges:
    - src/flask/config.py:102-124
    - src/flask/config.py:126-185
    - src/flask/config.py:187-216
    - src/flask/config.py:218-254
  reference_answer: >-
    Класс Config (наследник dict) даёт несколько загрузчиков. from_pyfile исполняет
    Python-файл как модуль и передаёт его в from_object, а from_object копирует только
    атрибуты в верхнем регистре; from_envvar берёт путь к файлу из переменной окружения и
    вызывает from_pyfile. from_prefixed_env читает переменные с префиксом FLASK_, разбирает
    значения через json.loads и поддерживает вложенные ключи через "__"; есть также from_file
    с произвольным загрузчиком и from_mapping.
  notes: "Проверено чтением config.py:102-254."

- id: q18
  type: semantic
  question: "Как Flask сериализует в JSON типы, которых нет в стандартном json: даты, UUID, Decimal, dataclass?"
  expected_files:
    - src/flask/json/provider.py
  expected_symbols:
    - _default
    - DefaultJSONProvider
    - DefaultJSONProvider.dumps
  expected_ranges:
    - src/flask/json/provider.py:108-121
    - src/flask/json/provider.py:124-138
    - src/flask/json/provider.py:166-179
  reference_answer: >-
    DefaultJSONProvider.dumps передаёт в json.dumps параметр default=self.default, а default
    по умолчанию это функция _default. Она превращает date/datetime в HTTP-дату (http_date),
    Decimal и UUID в строку, dataclass в словарь через dataclasses.asdict, объекты с
    __html__ в строку, а для остальных типов выбрасывает TypeError.
  notes: "Проверено чтением json/provider.py:108-179; default = staticmethod(_default) на строке 138."

