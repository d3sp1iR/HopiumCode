- id: q27
  type: overview
  question: "Какие контексты есть во Flask и за что отвечает каждый из них?"
  expected_files:
    - src/flask/ctx.py
    - src/flask/globals.py
  expected_symbols:
    - AppContext
    - RequestContext
    - _AppCtxGlobals
    - current_app
    - request
  expected_ranges:
    - src/flask/ctx.py:29-31
    - src/flask/ctx.py:238-249
    - src/flask/ctx.py:287-335
    - src/flask/globals.py:28-51
  reference_answer: >-
    Есть контекст приложения AppContext и контекст запроса RequestContext. AppContext хранит
    приложение, URL-адаптер и объект g (_AppCtxGlobals, пространство имён для данных на время контекста) и
    пушится в начале запроса или при выполнении CLI-команд. RequestContext хранит запрос,
    URL-адаптер, сессию и flash-сообщения, а при pop запускает teardown-функции. Глобальные
    current_app, g, request и session — это LocalProxy поверх этих контекстов.
  notes: "Проверено по docstring'ам классов в ctx.py и определениям LocalProxy в globals.py:28-51."

