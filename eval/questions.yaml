    Только по docstring'ам и коду sansio/*.py. grep -nE "def (wsgi_app|run|full_dispatch_request)"
    sansio/*.py пусто. sansio/README.md (sans-IO, Quart) намеренно не используется:
    это не .py и в индекс не попадает.

